name: Original showcase verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: showcase-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read fixed project binding
        run: |
          python3 - <<'PY'
          import json, os
          p = json.load(open('.homelab/ci-project.json'))['project']
          if p not in ['portfolio', 'camp', 'shop', 'shop-web', 'encore', 'atlas']:
              raise SystemExit('Unknown project')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('java=' + ('25' if p == 'camp' else '21') + '\n')
          PY
        id: project
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: ${{ steps.project.outputs.java }}
      - name: Original frontend, full backend and isolated integration fixtures
        run: python3 scripts/homelab-ci.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: verification-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            work/homelab-ci/summary.json
            work/ci/evidence/summary.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
      # No registry write/deploy; verified images require a separate release gate.
