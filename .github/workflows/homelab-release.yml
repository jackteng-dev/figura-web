name: Private GHCR component release
on:
  workflow_run:
    workflows: [Portfolio CI, Original showcase verification]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: private-ghcr-main
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      vars.HOMELAB_PUBLISH_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact main CI, package minimal contexts and publish private digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMELAB_PUBLISH_ENABLED: ${{ vars.HOMELAB_PUBLISH_ENABLED }}
          HOMELAB_BOOTSTRAP_PRIVATE: ${{ vars.HOMELAB_BOOTSTRAP_PRIVATE }}
        run: python3 scripts/showcase-publish.py --publish
      - name: Immutable deployment metadata only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: homelab-release
          path: work/release/delivery/release.json
          if-no-files-found: error
          retention-days: 90
      - name: Safe packaging summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: packaging-summary
          path: work/release/summary.json
          if-no-files-found: warn
          retention-days: 30
      # No host key, deployment URL, privileged runner or production DB secret.
