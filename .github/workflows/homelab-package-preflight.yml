name: Private release packaging preflight
on:
  push:
    branches: [homelab/cd-private-release-20261017]
permissions:
  contents: read
  actions: read
concurrency:
  group: release-packaging-preflight
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: New packaging checks, reuse accepted main CI without rerunning old acceptance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/showcase-publish.py --preflight
      - name: Numeric packaging evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: packaging-preflight
          path: |
            work/release/summary.json
            work/release/patch-tests.json
          if-no-files-found: warn
          retention-days: 30
